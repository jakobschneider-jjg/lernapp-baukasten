<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ein Licht für den Stall</title>
<style>
@font-face{font-family:"Andika";src:url(data:font/woff2;base64,{{FONT}}) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1024;color:#1b1b24;font-family:"Andika",ui-rounded,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#huelle{position:fixed;inset:0;display:grid;place-items:center;perspective:1600px}
#stage{position:relative;width:min(100vw,160vh);aspect-ratio:16/10;overflow:hidden;background:#13203f;border-radius:6px}
#welt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.szene{position:absolute;inset:0;visibility:hidden}
.szene.an{visibility:visible}
.ebene{position:absolute;left:-10%;top:-10%;width:120%;height:120%;pointer-events:none;will-change:transform}
.ebene canvas{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;pointer-events:auto;border-radius:16px}
.frei{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
/* Licht */
.glut{border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,180,80,.28) 25%,rgba(255,170,60,.1) 50%,rgba(255,170,60,0) 70%);mix-blend-mode:screen;animation:flacker 2.6s infinite ease-in-out}
@keyframes flacker{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}30%{opacity:.86;transform:translate(-50%,-50%) scale(.97)}60%{opacity:.95;transform:translate(-50%,-50%) scale(1.02)}}
#nacht{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 40% 45% at 82% 80%,rgba(0,0,0,0),rgba(4,6,20,.35) 55%,rgba(4,6,20,.62) 100%);transition:opacity 2.4s}
body.offen #nacht{opacity:.25}
.tuer{perspective:600px;transform-style:preserve-3d}
.tuer canvas{width:100%;height:100%;display:block;transform-origin:0 50%;transition:transform 1.6s cubic-bezier(.3,.1,.2,1)}
body.offen .tuer canvas{transform:rotateY(-78deg)}
.tuerlicht{background:linear-gradient(#ffd57a,#ffb84a);opacity:0;transition:opacity 1.4s;box-shadow:0 0 60px 30px rgba(255,190,90,.0)}
body.offen .tuerlicht{opacity:1;box-shadow:0 0 90px 40px rgba(255,190,90,.55)}
.fensterlicht{background:#ffd57a;opacity:0;transition:opacity 2s 1s;mix-blend-mode:screen}
body.offen .fensterlicht{opacity:.85}
.schlossbild img{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
body.offen .schlossbild{opacity:0;transition:opacity .4s}
.zettelbild{background:#fbf3d9;border:2px solid #1b1b24;border-radius:3px;transform:translate(-50%,-50%) rotate(-6deg);display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.zettelbild span{font-size:clamp(14px,2vw,26px);font-weight:700}
.spot.s-fenster.zeig,.spot.s-schloss:active,.spot.s-zettel:active{animation:zeig 1.1s infinite}
@keyframes zeig{50%{box-shadow:0 0 0 6px #ffd257,0 0 30px 10px rgba(255,210,87,.8)}}
#schnee,#dunkel,#rahmen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Tiere drinnen */
.spot.tier.on{outline:5px dashed #ff4f8b;outline-offset:-6px;background:rgba(255,79,139,.08)}
.spot.tier.on::after{content:"✓";position:absolute;right:6%;top:2%;font-size:clamp(18px,2.6vw,34px);font-weight:700;color:#fff;background:#ff4f8b;border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.mausbild canvas{width:100%;height:100%}
.mausbild.lauf{animation:lauf 4s ease-in forwards}
@keyframes lauf{0%{transform:translate(-50%,-50%)}15%{transform:translate(-50%,-62%) rotate(-6deg)}70%{transform:translate(160%,-50%);opacity:1}71%{opacity:0}90%{transform:translate(-50%,-50%);opacity:0}100%{transform:translate(-50%,-50%);opacity:1}}
.piep{font-size:clamp(20px,3vw,40px);color:#fff;font-weight:700;animation:piep 1s forwards}
@keyframes piep{to{transform:translate(-50%,-160%);opacity:0}}
/* Leiste oben, Knöpfe */
#leiste{position:absolute;left:3%;right:3%;top:5%;display:flex;align-items:center;gap:10px;pointer-events:none}
#lichtSlots{display:flex;gap:4px;background:rgba(10,16,40,.55);border-radius:999px;padding:4px 10px;pointer-events:auto}
#lichtSlots .slot{width:clamp(26px,3.4vw,44px);height:auto;opacity:.9}
#lichtSlots .slot.an{filter:drop-shadow(0 0 8px rgba(255,210,87,.9))}
#stufen button{color:#cbd5ea;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:13px}
#stufen button.on{background:#ffd257;color:#1b1b24;font-weight:700}
.rund{position:absolute;bottom:5%;width:clamp(64px,8vw,96px);height:clamp(64px,8vw,96px);border-radius:50%;background:#fbf3d9;border:4px solid #1b1b24;box-shadow:0 4px 0 #1b1b24;display:grid;place-items:center}
.rund img{width:78%}
#hilfe{left:3.5%}
#zurueck{left:auto;right:3.5%;width:auto;border-radius:999px;padding:0 20px;font-size:clamp(20px,2.4vw,30px);font-weight:700;display:flex;gap:8px}
#zurueck img.mini{width:44px}
#zaehler{position:absolute;left:50%;top:4.5%;transform:translateX(-50%);display:flex;gap:10px;background:#fbf3d9;border:4px solid #1b1b24;border-radius:20px;padding:6px 12px;box-shadow:0 4px 0 #1b1b24}
.zchip{display:flex;flex-direction:column;align-items:center;min-width:clamp(70px,8vw,100px)}
.zchip img{width:clamp(52px,6vw,74px)}
.zchip i{font-style:normal;font-size:clamp(14px,1.6vw,19px)}
.zchip b{font-size:clamp(26px,3vw,40px);line-height:1}
/* Karten */
#karte,#schlossBox{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,6,20,.55);z-index:20}
#karte[hidden],#schlossBox[hidden],#zaehler[hidden],#zurueck[hidden]{display:none}
.papier{background:#fbf3d9;border:4px solid #1b1b24;border-radius:22px 18px 24px 16px;box-shadow:0 6px 0 #1b1b24;padding:22px 28px;max-width:min(760px,92vw);transform:rotate(-.6deg);animation:rein .35s ease-out}
@keyframes rein{from{transform:translateY(30px) rotate(-.6deg);opacity:0}}
.kopf{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.kopf h2{margin:0;font-size:clamp(26px,3.2vw,40px)}
.kopfico{width:clamp(54px,6vw,74px)}
.lesen p{margin:.25em 0;line-height:1.45}
.lesen.st2{font-size:clamp(28px,3.4vw,40px)}
.lesen.st3{font-size:clamp(24px,2.9vw,34px)}
.lesen.st4{font-size:clamp(21px,2.5vw,29px)}
.bildreihe{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.bildreihe .ico{width:clamp(70px,9vw,110px)}
.bildreihe .gross{width:clamp(100px,13vw,160px)}
.pfeil{font-size:clamp(36px,4vw,56px);font-weight:700}
.frage{display:flex;flex-direction:column;align-items:center}
.frage b{font-size:clamp(28px,3vw,40px);line-height:1}
.kknoepfe{display:flex;justify-content:flex-end;gap:12px;margin-top:14px}
.kbtn{background:#fff;border:4px solid #1b1b24;border-radius:16px;padding:10px 22px;font-size:clamp(20px,2.4vw,28px);font-weight:700;box-shadow:0 4px 0 #1b1b24;display:flex;align-items:center;gap:8px}
.kbtn.gross{background:#ffd257}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1b24}
img.mini{width:34px}
/* Schloss */
#schloss{background:#fbf3d9;border:4px solid #1b1b24;border-radius:26px;box-shadow:0 6px 0 #1b1b24;padding:18px 22px 16px;position:relative;margin-top:60px}
.bügel{position:absolute;left:50%;top:-84px;transform:translateX(-50%);width:230px;height:130px;border:30px solid #8f98a8;outline:0;box-shadow:0 0 0 4px #1b1b24 inset;border-bottom:0;border-radius:110px 110px 0 0;z-index:-1}
.koerper{display:flex;gap:12px;background:#e3a920;border:4px solid #1b1b24;border-radius:18px;padding:14px}
.rad{display:flex;flex-direction:column;align-items:center;background:#fbf3d9;border:3px solid #1b1b24;border-radius:14px;padding:6px 8px;min-width:clamp(96px,11vw,130px)}
.rad img{width:clamp(60px,7vw,86px)}
.rad i{font-style:normal;font-size:clamp(16px,1.8vw,21px)}
.rad .pf{font-size:clamp(26px,3vw,36px);width:100%;padding:2px 0;border-radius:10px;background:#fff;border:3px solid #1b1b24}
.rad .zahl{font-size:clamp(46px,5.4vw,70px);line-height:1.05}
.srow{display:flex;justify-content:space-between;margin-top:14px;gap:12px}
.smeld{display:flex;align-items:center;gap:8px;justify-content:center;font-size:clamp(20px,2.3vw,26px);font-weight:700;min-height:1.4em;margin-top:8px}
#schloss.gesperrt .pf,#schloss.gesperrt #sOk{opacity:.35}
#schloss.wackeln{animation:wackeln .45s}
@keyframes wackeln{20%{transform:translateX(-14px) rotate(-2deg)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
#ki{position:absolute;right:4%;bottom:1.2%;font-size:10px;color:rgba(255,255,255,.55);pointer-events:none}
#laden{position:fixed;inset:0;display:grid;place-items:center;color:#cbd5ea;font-size:24px}
body.bereit #laden{display:none}
@media (prefers-reduced-motion:reduce){.glut,.spot.s-fenster.zeig{animation:none}}

#titel{color:#fbf3d9;font-size:clamp(18px,2.2vw,28px);text-shadow:0 2px 0 #0b1024;background:rgba(10,16,40,.55);border-radius:999px;padding:4px 16px;pointer-events:none}
#infoBtn{margin-left:auto;font-size:13px;color:#cbd5ea;background:rgba(10,16,40,.55);border-radius:999px;padding:6px 12px;pointer-events:auto}
#zurKarte{left:auto;right:3.5%;width:auto;border-radius:999px;padding:0 20px;font-size:clamp(18px,2.2vw,26px);font-weight:700}
#zurueck{left:auto;right:3.5%;width:auto;border-radius:999px;padding:0 20px;font-size:clamp(18px,2.2vw,26px);font-weight:700}
#aktion{left:auto;right:calc(3.5% + clamp(150px,16vw,210px))}
#hilfe[hidden],#aktion[hidden],#zurKarte[hidden],#zurueck[hidden],#hinweis[hidden],#info[hidden],#lvBox[hidden],#laden[hidden]{display:none}
#hinweis{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:#fbf3d9;border:3px solid #1b1b24;border-radius:16px;padding:10px 18px;font-size:clamp(18px,2.2vw,26px);box-shadow:0 4px 0 #1b1b24;z-index:5;max-width:80%}
.wackelt{animation:wackeln .45s}
/* Wegkarte */
.spot.wegpunkt{border-radius:50%;background:#fbf3d9;border:5px solid #1b1b24;box-shadow:0 6px 0 #1b1b24;display:grid;place-items:center}
.wegpunkt .wpbild{width:70%}
.wegpunkt b{position:absolute;left:-8%;top:-8%;background:#ffd257;border:3px solid #1b1b24;border-radius:50%;width:38%;height:38%;display:grid;place-items:center;font-size:clamp(16px,2vw,26px)}
.wegpunkt .wpstern{position:absolute;right:-14%;top:-14%;width:52%;filter:drop-shadow(0 0 8px rgba(255,210,87,.9))}
.wegpunkt .wpschloss{position:absolute;right:-6%;bottom:-6%;width:42%}
.wegpunkt.zu{background:#c9d0dd;filter:saturate(.4)}
.wegpunkt.zu .wpbild{opacity:.45}
.wegpunkt.offen{animation:zeig 1.6s infinite}
.wegpunkt.fertig{background:#fff3c4}
.wegpunkt.neu{animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* Station 1 */
.spurmarke{display:flex;align-items:center;gap:4px;background:#fbf3d9;border:3px solid #1b1b24;border-radius:14px;padding:2px 8px;opacity:0;transition:opacity .6s;justify-content:center}
.spurmarke b{font-size:clamp(16px,2vw,26px)}.spurmarke img{width:44%}
.spurmarke.an{opacity:1}
.spurglanz{border-radius:50%;background:radial-gradient(ellipse,rgba(255,236,150,.45),rgba(255,236,150,0) 70%);opacity:0;transition:opacity .8s;mix-blend-mode:screen}
.spurglanz.an{opacity:1}
.zahlen{font-size:40px}
/* Station 3 */
.blase{background:#fff;border:4px solid #1b1b24;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 0 #1b1b24;cursor:pointer}
.blase .bbild{width:72%}
.blase.zeig{animation:zeig 1.1s infinite}
.blase.geloest{background:#e3f4ea}
.spot.tierspot.gefragt{outline:4px dashed rgba(255,210,87,.8);outline-offset:-8px}
.spot.zeig,.spot.tierspot.zeig{animation:zeig 1.1s infinite}
.herzflug{width:60px;animation:herz 2.4s ease-out forwards}
.herzflug img{width:60px}
@keyframes herz{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-260%);opacity:0}}
/* Station 4 */
.linien{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sternlinie{fill:none;stroke:#ffe27a;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(255,226,122,.8))}
.spot.sternpunkt{border-radius:50%;display:grid;place-items:center}
.sternpunkt .spbild{width:62%;opacity:.55;filter:grayscale(.5)}
.sternpunkt b{position:absolute;left:50%;top:-8%;transform:translateX(-50%);background:#fbf3d9;border:3px solid #1b1b24;border-radius:999px;padding:0 8px;font-size:clamp(16px,2vw,26px);white-space:nowrap}
.sternpunkt b.wort{font-size:clamp(13px,1.6vw,20px)}
.sternpunkt.an .spbild{opacity:1;filter:drop-shadow(0 0 10px rgba(255,226,122,.95))}
.sternpunkt.blink{animation:zeig .9s infinite}
.grossstern{opacity:0;transform:translate(-50%,-50%) scale(.3);transition:opacity 1.6s,transform 1.6s}
.grossstern img{width:100%;filter:drop-shadow(0 0 40px rgba(255,236,160,.95))}
.grossstern.an{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* Station 5 */
.sprite canvas{width:100%;height:100%}
.sprite.hirten{transition:left .6s linear,top .6s linear}
.spot.wegpfeil{border-radius:50%;background:#fbf3d9;border:4px solid #1b1b24;box-shadow:0 4px 0 #1b1b24;display:grid;place-items:center}
.wegpfeil .pfbild{width:76%}
.sprech{background:#fbf3d9;border:3px solid #1b1b24;border-radius:16px;padding:6px 14px;font-size:clamp(16px,2vw,24px);white-space:nowrap;z-index:3;box-shadow:0 4px 0 #1b1b24}
.sprech img{width:40px;vertical-align:middle}
/* Station 6 */
.spot.ding.zeig{animation:zeig 1.1s infinite}
.spot.ding.gefunden{outline:5px dashed #ffd257;outline-offset:-6px}
.fuellung{background:linear-gradient(#f0cd5e,#d9a83a);border:3px solid #1b1b24;border-radius:50% 50% 10px 10px;transform:translate(-50%,-50%) scaleY(var(--h,0));transform-origin:50% 100%;transition:transform .5s;opacity:0}
.fuellung.an{opacity:1}
.sprite.baby{transition:left 1.6s ease-in-out,top 1.6s ease-in-out}
/* Finale */
.finalstern{opacity:.35;filter:grayscale(.6);transition:all 2s}
.finalstern img{width:100%}
.finalstern.an{opacity:1;filter:drop-shadow(0 0 60px rgba(255,236,160,1));transform:translate(-50%,-50%) scale(1.25)}
.funke{width:44px;opacity:0;animation:funke 2.6s ease-out forwards}
.funke img{width:44px}
@keyframes funke{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
/* Schloss: Räder mit Bildern */
.rlabel{display:flex;flex-direction:column;align-items:center;min-height:clamp(40px,5vw,60px);justify-content:center}
.rlabel .lbild{width:clamp(60px,7vw,86px)}
.rlabel i{font-style:normal;font-size:clamp(15px,1.7vw,20px)}
.rnr{font-size:clamp(26px,3vw,38px)}
.rad .wert{min-height:clamp(70px,8vw,100px);display:grid;place-items:center}
.rad .wert .rbild{width:clamp(70px,8vw,100px)}
.rad .wert .zahl{font-size:clamp(46px,5.4vw,70px);line-height:1.05}
.auftrag{margin-top:10px;padding-top:8px;border-top:3px dashed #d2c7a8}
/* Lehrkraft */
#info{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,6,20,.6);z-index:30}
.lkpanel{background:#fff;border:4px solid #1b1b24;border-radius:20px;padding:20px 24px;width:min(520px,92vw);box-shadow:0 6px 0 #1b1b24}
.lkpanel h3{margin:0 0 10px}
#pinShow{display:flex;gap:10px;justify-content:center;margin:10px 0}
#pinShow i{width:18px;height:18px;border-radius:50%;border:3px solid #1b1b24}
#pinShow i.f{background:#1b1b24}
#pinPad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
#pinPad button{height:60px;border-radius:14px;border:3px solid #1b1b24;background:#fbf3d9;font-size:26px;font-weight:700}
.stufenwahl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.stufebtn{border:2px solid #b9c2cf;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;background:#fff;font-size:13px;color:#56657a}
.stufebtn b{font-size:24px;color:#1b1b24}
.stufebtn.on{border-color:#1b1b24;background:#ffe9a8;color:#1b1b24}
.lkzeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.lkbtn{border:3px solid #1b1b24;border-radius:12px;padding:8px 14px;background:#fff;font-size:16px}
.lkbtn.on{background:#ffd257}
.lkbtn.rot{background:#9c2a1f;color:#fff}
#lkSpeicher{font-size:13px;color:#56657a}
#lvBox{position:fixed;inset:0;background:#fbf3d9;z-index:40;padding:24px;overflow:auto;font-size:18px}
#lvTab table{border-collapse:collapse;margin-top:12px}#lvTab td,#lvTab th{border:1px solid #b9c2cf;padding:6px 10px;text-align:left}
</style>
</head>
<body>
<div id="laden">Der Stall wird gemalt …</div>
<div id="huelle"><div id="stage">
  <div id="welt"></div>
  <div id="nacht"></div>
  <canvas id="schnee"></canvas>
  <canvas id="dunkel"></canvas>
  <canvas id="rahmen"></canvas>
  <div id="leiste"><div id="lichtSlots"></div><div id="titel"></div><button id="infoBtn">Info</button></div>
  <button class="rund" id="hilfe" aria-label="Laterne: Tipp" hidden></button>
  <button class="rund" id="aktion" aria-label="Schloss" hidden></button>
  <button class="rund" id="zurKarte" hidden></button>
  <button class="rund" id="zurueck" hidden>◀ Tür</button>
  <div id="zaehler" hidden></div>
  <div id="hinweis" hidden></div>
  <div id="ki">mit KI erstellt · geprüft: J. Schneider · nach Astrid Lindgren, „Weihnachten im Stall“ (Oetinger) · rough.js (MIT) · Schrift Andika (SIL OFL)</div>
</div></div>
<div id="schlossBox" hidden><div id="schloss"></div></div>
<div id="karte" hidden></div>
<div id="info" hidden><div class="lkpanel">
  <h3>Lehrkraft</h3>
  <div id="lkCode"><p>Lehrkraft-Code</p><div id="pinShow"></div><div id="pinPad"></div></div>
  <div id="lkOffen" hidden>
    <p><b>Lesestufe auf diesem Gerät</b></p><div class="stufenwahl" id="lkStufen"></div>
    <div class="lkzeile"><button class="lkbtn" id="lkAlle">Alle Stationen öffnen</button><button class="lkbtn" id="lkLoeschen">Fortschritt löschen</button><button class="lkbtn rot" id="lkJa" hidden>Ja, löschen</button></div>
    <p id="lkSpeicher"></p>
  </div>
  <div class="lkzeile"><button class="lkbtn" id="lkZu">Schließen</button></div>
</div></div>
<div id="lvBox" hidden><h2>Ein Licht für den Stall</h2><p id="lvText"></p><div id="lvTab"></div></div>
<script>{{ROUGH}}</script>
<script>{{JS}}</script>
</body>
</html>
